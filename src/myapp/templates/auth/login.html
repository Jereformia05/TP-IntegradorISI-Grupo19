{% extends "base.html" %}

{% block title %}Iniciar Sesión{% endblock %}

{% block content %}
<div class = "row justify-content-center">
    <div class = "col-md-6 col-lg-4">
        <div class = "card shadow-sm">
            <div class = "card-body p-4">
                <h3 class = "card-title text-center mb-4"> Iniciar sesion</h3>

                <form method="POST" action="{{url_for('web.login_view')}}">
                    <div class="mb-3">
                        <label for = "email" class="form-label">Correo Electronico</label>
                        <input type="email" class="form-control" id="email" name="email" required placeholder="ejemplo@utn.edu.ar">
                    </div>
                    <div class="mb-3">
                        <label for="password" class="form-label">Contraseña</label>
                        <input type="password" class="form-control" id="password" name="password" required>
                    </div>
                    <button type="submit" class="btn btn-primary w-100">Ingresar</button>
                </form>

                <div class = "text-center mt-3">
                    <small> ¿No tenés cuenta? <a href="{{ url_for('web.register_view') }}">Registrate acá</a></small>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
